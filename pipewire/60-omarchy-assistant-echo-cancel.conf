# Omarchy Assistant: an echo-cancelled microphone so the assistant can hear you
# talk over it. The speakers' monitor is the echo reference; the default mic and
# speakers are unchanged, and the source only runs while the assistant uses it.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      aec.args = {
        webrtc.high_pass_filter  = true
        webrtc.noise_suppression = false
        webrtc.gain_control      = false
      }
      capture.props = { node.name = "omarchy_assistant_aec_capture" node.passive = true }
      source.props = {
        node.name        = "omarchy_assistant_aec"
        node.description = "Omarchy Assistant (echo-cancelled mic)"
        node.passive     = true
        node.virtual     = true
      }
    }
  }
]
